name: Deploy website to GitHub Pages

on:
  push:
    branches: [claude/project-thread-2lig8f, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp asset versions so browsers fetch the new CSS and JS
        run: |
          v="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './node_modules/*' -not -path './.git/*' \
            -exec sed -i -E "s/\\?v=[0-9A-Za-z]+\"/?v=${v}\"/g" {} +
          grep -h '?v=' index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
